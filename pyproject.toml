[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mg_sampling"
version = "2025.0"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "scienceplots",
  "seaborn",
  "MDAnalysis",
  "barnaba",
  "dask",
  "bussilab",
  "pdbfixer @ git+https://github.com/openmm/pdbfixer.git@29fcf15f95f19f92211283fefdd0a086da37d646",
  "openmm>=8.2,<8.4",  # for pdbfixer; 8.4+ wheels need glibc 2.34 (cluster: 2.28)
  "cryomap @ git+ssh://git@github.com/ollyfutur/cryomap.git@3aed484a7e1b463d821aac133e66fc84f6d5432e",
  "pyarrow",
  "nbconvert",
  "mrcfile",
  "torch==2.7.1",
  "infomeasure",
]
requires-python = ">=3.11"
authors = [
  {name = "Olivier Languin-Cattoën", email = "olanguin@sissa.it"},
]
maintainers = [
  {name = "Olivier Languin-Cattoën", email = "olanguin@sissa.it"},
]
description = "Python code for enhanced Mg-RNA dynamics project"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mg_sampling*", "pipeline*"]

[tool.ruff]
line-length = 100

[project.scripts]
ion_motif_analysis = "mg_sampling.motifs:main"
