[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mg_sampling"
version = "2025.0"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "scienceplots",
  "seaborn",
  "MDAnalysis",
  "barnaba",
  "dask",
  "bussilab",
  "pdbfixer @ git+https://github.com/openmm/pdbfixer.git@29fcf15f95f19f92211283fefdd0a086da37d646",
  "cryomap @ git+ssh://git@github.com/ollyfutur/cryomap.git@dfa1422d5f044d417964202f7a430996d8d61ab2",
  "pyarrow",
  "nbconvert",
  "mrcfile",
  "torch==2.7.1",
  "infomeasure",
]
requires-python = ">=3.11"
authors = [
  {name = "Olivier Languin-Cattoën", email = "olanguin@sissa.it"},
]
maintainers = [
  {name = "Olivier Languin-Cattoën", email = "olanguin@sissa.it"},
]
description = "Python code for enhanced Mg-RNA dynamics project"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mg_sampling*", "pipeline*"]

[project.scripts]
ion_motif_analysis = "mg_sampling.motifs:main"
forward_density = "mg_sampling.density.forward_density:main"
align = "mg_sampling.density.align:main"
